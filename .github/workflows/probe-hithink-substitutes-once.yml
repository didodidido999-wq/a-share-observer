name: One-time research of hithink cross-market substitutes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-hithink-substitutes-once.yml'
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: ths-substitutes-once
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: a-share-observer/requirements.txt
      - run: python -m pip install -r a-share-observer/requirements.txt
      - name: Check Python parser
        run: python -m py_compile a-share-observer/scripts/probe_hithink_substitutes.py
      - name: Probe ETF identities, 20-day history and futures series
        env:
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
        run: python a-share-observer/scripts/probe_hithink_substitutes.py
      - name: Save sanitized discovery only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add a-share-observer/docs/data/global/substitute-discovery.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: verified hithink substitute availability snapshot'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort; exit 1; fi
            sleep "$attempt"
          done
          exit 1
