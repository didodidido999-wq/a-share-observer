name: Update A-share dashboard

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = daily; refresh = latest 10-day event/feedback fill; backfill = expensive full; rebuild = no API"
        type: choice
        required: true
        default: auto
        options:
          - auto
          - backfill
          - rebuild
          - refresh
  push:
    branches: [main]
    paths:
      - '.github/workflows/update.yml'
      - 'a-share-observer/scripts/v3_events.py'
      - 'a-share-observer/scripts/v3_feedback.py'
  schedule:
    # Beijing 16:00 (UTC 08:00), Mon-Fri; the collector verifies actual trading dates.
    - cron: '0 8 * * 1-5'
    # 16:45 Beijing: retry only uncollected or incomplete modules for today.
    - cron: '45 8 * * 1-5'
    # Saturday 16:45 Beijing: only retry incomplete recent event/T+1 archives.
    - cron: '45 8 * * 6'

permissions:
  contents: write
concurrency:
  group: a-share-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: a-share-observer/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r a-share-observer/requirements.txt
      - name: Test collectors
        run: python -m pytest -q a-share-observer/tests
      - name: Capture or backfill hithink-finance data
        env:
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python a-share-observer/scripts/history.py --mode "${{ github.event_name == 'push' && 'refresh' || github.event.schedule == '45 8 * * 6' && 'refresh' || github.event.inputs.mode || 'auto' }}"
      - name: Commit derived market data only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A a-share-observer/docs/data/
          if git diff --cached --quiet; then
            echo 'No new data to commit'
            exit 0
          fi
          git commit -m 'data: append historical market observations'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo 'New data committed'
              exit 0
            fi
            echo "Remote main advanced; fetching and rebasing ($attempt/3)"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Data conflict requires review; will not force push'
              exit 1
            fi
            sleep "$attempt"
          done
          echo 'Could not publish after 3 attempts'
          exit 1
