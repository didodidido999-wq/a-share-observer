name: Observe market financing and disclosed ETF holders

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "all / margin / disclosure"
        type: choice
        required: true
        default: all
        options: [all, margin, disclosure]
  push:
    branches: [main]
    paths:
      - '.github/workflows/funds-observer.yml'
      - 'a-share-observer/scripts/funds_observer.py'
  schedule:
    # Beijing weekday 09:30, capture published T-1 financing (not same-day).
    - cron: '30 1 * * 1-5'
    # Monday 09:45 for quarterly filed ETF holder/ownership structure.
    - cron: '45 1 * * 1'
permissions:
  contents: write
concurrency:
  group: market-funds-observer
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: a-share-observer/requirements.txt
      - run: python -m pip install -r a-share-observer/requirements.txt
      - name: Offline source-shape and no-fake-flow tests
        run: python -m pytest -q a-share-observer/tests/test_funds_observer.py
      - name: Fetch published financing and/or filed ETF holders
        env:
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
        run: python a-share-observer/scripts/funds_observer.py --mode "${{ github.event_name == 'push' && 'all' || github.event.inputs.mode || github.event.schedule == '45 1 * * 1' && 'disclosure' || 'margin' }}"
      - name: Commit only valid derived observations
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A a-share-observer/docs/data/funds-observer.json
          if git diff --cached --quiet; then
            echo 'No new observed data'
            exit 0
          fi
          git commit -m 'data: append financing and institution ownership disclosure'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            sleep "$attempt"
          done
          exit 1
