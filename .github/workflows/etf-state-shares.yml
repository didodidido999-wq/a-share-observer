name: Observe official ETF share changes for institutional inference

on:
  workflow_dispatch:
    inputs:
      lookback:
        description: "Recent archived A-share trading days (2-95)"
        required: true
        default: "12"
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/etf-state-shares.yml'
      - 'a-share-observer/scripts/etf_shares.py'
  schedule:
    # Beijing 09:15 Monday-Friday, T+1 official previous-day shares.
    - cron: '15 1 * * 1-5'

permissions:
  contents: write
concurrency:
  group: marketscope-etf-shares
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: a-share-observer/requirements.txt
      - run: python -m pip install -r a-share-observer/requirements.txt
      - name: Validate share units and unavailable-data behavior offline
        run: python -m pytest -q a-share-observer/tests/test_etf_shares.py
      - name: Collect direct exchange share disclosures
        env:
          LOOKBACK: ${{ github.event.inputs.lookback || '12' }}
        run: python a-share-observer/scripts/etf_shares.py --lookback "$LOOKBACK"
      - name: Commit only new verified observations
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A a-share-observer/docs/data/etf-shares.json
          if git diff --cached --quiet; then
            echo "No new official ETF shares"
            exit 0
          fi
          git commit -m 'data: append official dated ETF share observations'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            sleep "$attempt"
          done
          exit 1
