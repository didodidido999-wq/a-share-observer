name: Weekly sector members / daily market internals
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'weekly refresh or daily close metrics'
        type: choice
        required: true
        default: daily
        options:
          - daily
          - weekly
  push:
    branches: [main]
    paths:
      - '.github/workflows/sectors.yml'
  schedule:
    # Beijing Sunday 16:07: confirm current member roster once per week.
    - cron: '7 8 * * 0'
    # Beijing weekdays 16:34 and 17:09: daily prices/events, reuse the weekly roster.
    - cron: '34 8 * * 1-5'
    - cron: '9 9 * * 1-5'
permissions:
  contents: write
concurrency:
  group: sector-membership-daily
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: a-share-observer/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r a-share-observer/requirements.txt
      - name: Check data transformation
        run: python -m pytest -q a-share-observer/tests
      - name: Capture current membership and factual metrics
        env:
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
          SECTOR_MEMBERS_WORKERS: '2'
          SECTOR_MEMBERS_THROTTLE: '0.5'
          PYTHONUNBUFFERED: '1'
        run: python a-share-observer/scripts/v5_sector.py --mode "${{ (github.event_name == 'push' || github.event.schedule == '7 8 * * 0') && 'weekly' || github.event.inputs.mode || 'daily' }}"
      - name: Commit derived sector archive and daily quality
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A a-share-observer/docs/data/
          if git diff --cached --quiet; then
            echo 'No new sector observations to commit'
            exit 0
          fi
          git commit -m 'data: record observed sector constituents and breadth'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Sector data conflict; preserved branch state without force push'
              exit 1
            fi
            sleep "$attempt"
          done
          exit 1
      - name: Fail visibly if data coverage is critically low
        if: github.event_name != 'push' && github.event.schedule != '7 8 * * 0' && github.event.inputs.mode != 'weekly'
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path
          day=datetime.now(ZoneInfo('Asia/Shanghai')).date().isoformat()
          obj=json.loads(Path(f'a-share-observer/docs/data/history/{day}.json').read_text())
          state=obj.get('quality_manifest',{}).get('sector_members',{})
          actual=state.get('items_count') or 0
          expected=state.get('expected_count') or 0
          print('Observed sector coverage:',actual,'/',expected,'status:',state.get('status'))
          if not expected or actual/expected < .90:
              raise SystemExit('Sector membership completeness below 90%; inspect provider/API quota')
          PY
