name: Collect market environment and stock risk facts
on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/risk-research-redesign']
    paths:
      - '.github/workflows/risk-observer.yml'
      - 'a-share-observer/scripts/risk_data.py'
  schedule:
    # Beijing 19:20 daily. Weekend disclosures are checked too; dates remain source-specific.
    - cron: '20 11 * * *'
permissions:
  contents: write
concurrency:
  group: marketscope-data-writer
  cancel-in-progress: false
  queue: max
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r a-share-observer/requirements.txt
      - run: python -m pytest -q a-share-observer/tests
      - name: Collect dated risk observations
        env:
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
        run: python a-share-observer/scripts/risk_data.py
      - name: Compile persistent public evidence without changing its source
        run: python a-share-observer/scripts/reviewed_evidence.py --apply
      - uses: actions/upload-artifact@v4
        with:
          name: risk-observations
          path: |
            a-share-observer/docs/data/reviewed-index.json
            a-share-observer/docs/data/risk-observer.json
            a-share-observer/docs/data/risk-macro.json
            a-share-observer/docs/data/risk-stocks/
      - name: Commit verified observations to the running branch
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/risk-research-redesign'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add a-share-observer/docs/data/reviewed-index.json a-share-observer/docs/data/risk-observer.json a-share-observer/docs/data/risk-macro.json a-share-observer/docs/data/risk-stocks/
          git diff --cached --quiet && exit 0
          git commit -m 'data: refresh market environment and stock risk facts'
          for attempt in 1 2 3; do
            if git push origin "HEAD:$TARGET_BRANCH"; then exit 0; fi
            git fetch origin "$TARGET_BRANCH"
            git rebase "origin/$TARGET_BRANCH" || { git rebase --abort; exit 1; }
          done
          exit 1
