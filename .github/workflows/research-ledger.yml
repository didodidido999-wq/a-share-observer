name: Freeze and evaluate prospective market research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/research-ledger.yml"
      - "a-share-observer/scripts/research_ledger.py"
      - "a-share-observer/scripts/research_publication.py"
  schedule:
    # 20:40 Beijing, weekdays. EOD research, never a same-day 14:45 snapshot.
    - cron: '40 12 * * 1-5'
permissions:
  contents: write
concurrency:
  group: marketscope-data-writer
  queue: max
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r a-share-observer/requirements.txt
      - name: Verify frozen ledger and run its tests
        run: |
          python a-share-observer/scripts/research_ledger.py --check
          python -m pytest -q a-share-observer/tests/test_research_ledger.py a-share-observer/tests/test_research_calendar.py a-share-observer/tests/test_research_publication.py
      - name: Generate current snapshot and settle mature outcomes
        run: |
          python a-share-observer/scripts/research_ledger.py
          python a-share-observer/scripts/research_ledger.py --check --git-base HEAD
      - name: Publish new research files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add a-share-observer/docs/data/research-ledger.json a-share-observer/docs/data/research-current.json
          if ! git diff --cached --quiet; then
            git commit -m 'research: freeze daily evidence and settle mature outcomes'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Verify the exact forecast has reached the live website
        run: python a-share-observer/scripts/research_publication.py --output /tmp/verified-research-id
      - name: Activate only the verified public forecast
        run: |
          python a-share-observer/scripts/research_ledger.py --activate-id "$(cat /tmp/verified-research-id)"
          git add a-share-observer/docs/data/research-ledger.json a-share-observer/docs/data/research-current.json
          if ! git diff --cached --quiet; then
            git commit -m 'research: record verified publication time'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prospective-research-audit
          path: |
            a-share-observer/docs/data/research-current.json
            a-share-observer/docs/data/research-ledger.json
            a-share-observer/docs/data/research-calendar.json
