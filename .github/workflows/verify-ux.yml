name: Browser UX smoke and static site integration
on:
  pull_request:
    paths:
      - '.github/workflows/research-ledger.yml'
      - 'a-share-observer/docs/**'
      - 'a-share-observer/scripts/*ui-smoke.mjs'
      - 'a-share-observer/scripts/layout-evidence.mjs'
      - 'a-share-observer/docs/index.html'
      - 'a-share-observer/docs/v3.js'
      - 'a-share-observer/docs/risk-workspace.js'
      - 'a-share-observer/docs/global-context.js'
      - 'a-share-observer/docs/reviewed-context.js'
      - 'a-share-observer/scripts/reviewed-ui-smoke.mjs'
      - 'a-share-observer/docs/global-context.css'
      - 'a-share-observer/scripts/global-ui-smoke.mjs'
      - 'a-share-observer/docs/risk-workspace.css'
      - 'a-share-observer/scripts/risk-ui-smoke.mjs'
      - 'a-share-observer/docs/v3.css'
      - 'a-share-observer/scripts/ui-smoke.mjs'
      - '.github/workflows/verify-ux.yml'
  push:
    branches: [main, feat/theme-client]
    paths:
      - '.github/workflows/research-ledger.yml'
      - 'a-share-observer/docs/**'
      - 'a-share-observer/scripts/*ui-smoke.mjs'
      - 'a-share-observer/scripts/layout-evidence.mjs'
      - 'a-share-observer/docs/index.html'
      - 'a-share-observer/docs/v3.js'
      - 'a-share-observer/docs/risk-workspace.js'
      - 'a-share-observer/docs/global-context.js'
      - 'a-share-observer/docs/reviewed-context.js'
      - 'a-share-observer/scripts/reviewed-ui-smoke.mjs'
      - 'a-share-observer/docs/global-context.css'
      - 'a-share-observer/scripts/global-ui-smoke.mjs'
      - 'a-share-observer/docs/risk-workspace.css'
      - 'a-share-observer/scripts/risk-ui-smoke.mjs'
      - '.github/workflows/verify-ux.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build static site
        run: npm run build
      - name: Install headless Chromium and Playwright
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Browser-smoke the four pages, sliders, cards, metric ranking and mobile
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory a-share-observer/docs >/tmp/marketscope-http.log 2>&1 &
          sleep 3
          node a-share-observer/scripts/ui-smoke.mjs
      - name: Risk browser interactions with explicit synthetic fixtures
        run: node a-share-observer/scripts/risk-ui-smoke.mjs
      - name: Global context browser date and proxy safeguards
        run: node a-share-observer/scripts/global-ui-smoke.mjs
      - name: Public evidence revision and asynchronous browser safeguards
        run: node a-share-observer/scripts/reviewed-ui-smoke.mjs
      - name: Research and policy browser interactions
        run: |
          node a-share-observer/scripts/research-hub-ui-smoke.mjs
          node a-share-observer/scripts/policy-ui-smoke.mjs
      - name: Theme heatmap real-data interactions
        run: node a-share-observer/scripts/theme-ui-smoke.mjs
      - name: Capture real-data layout evidence
        run: node a-share-observer/scripts/layout-evidence.mjs
      - name: Save browser audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketscope-ux-debug
          path: |
            /tmp/marketscope-crude-spot.png
            /tmp/marketscope-crude-normalized.png
            /tmp/marketscope-disclosures.png
            /tmp/marketscope-disclosures-social-security.png
            /tmp/marketscope-market-redesign.png
            /tmp/marketscope-risk-redesign.png
            /tmp/marketscope-risk-redesign-mobile.png
            /tmp/marketscope-desktop.png
            /tmp/marketscope-mobile.png
            /tmp/marketscope-failed.png
            /tmp/marketscope-risk-failed.png
            /tmp/marketscope-global-failed.png
            /tmp/marketscope-risk-mobile.png
            /tmp/marketscope-theme*.png
            /tmp/marketscope-http.log
            /tmp/marketscope-today*.png
            /tmp/marketscope-risk*.png
            /tmp/marketscope-research*.png
            /tmp/marketscope-policy*.png
          if-no-files-found: ignore
