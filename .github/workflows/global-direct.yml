name: Capture directly readable cross-market data

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "all / treasury / etf"
        type: choice
        required: true
        default: all
        options: [all, treasury, etf]
  push:
    branches: [main]
    paths:
      - '.github/workflows/global-direct.yml'
      - 'a-share-observer/scripts/global_direct.py'
  schedule:
    # 18:23 Beijing on weekdays: ETFs closed; latest U.S. rates when available.
    - cron: '23 10 * * 1-5'
permissions:
  contents: write
concurrency:
  group: global-direct-data
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: a-share-observer/requirements.txt
      - run: python -m pip install -r a-share-observer/requirements.txt
      - name: Check source parsers and ETF identity
        run: python -m pytest -q a-share-observer/tests/test_global_direct.py
      - name: Collect official rates and existing-key listed ETF proxies
        env:
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python a-share-observer/scripts/global_direct.py --mode "${{ github.event_name == 'push' && 'all' || github.event.inputs.mode || 'all' }}"
      - name: Commit observed time series only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A a-share-observer/docs/data/global/
          if git diff --cached --quiet; then
            echo 'No new verified series to commit'
            exit 0
          fi
          git commit -m 'data: append verified Treasury rates and listed ETF proxy histories'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            sleep "$attempt"
          done
          exit 1
