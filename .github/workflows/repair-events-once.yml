# Follow-up trigger: retries remaining incomplete provider dates only.
name: One-time selective historical event repair
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-events-once.yml'
permissions:
  contents: write
concurrency:
  group: one-time-historic-event-repair
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: a-share-observer/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r a-share-observer/requirements.txt
      - name: Run collector safety tests
        run: python -m pytest -q a-share-observer/tests
      - name: Recover only missing archived event dates
        env:
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python a-share-observer/scripts/repair_events.py
      - name: Commit repaired event archives
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add a-share-observer/docs/data/history/ a-share-observer/docs/data/dashboard.json a-share-observer/docs/data/dates.json
          if git diff --cached --quiet; then
            echo 'Nothing to repair'
            exit 0
          fi
          git commit -m 'data: selectively repair historical event pools'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            sleep "$attempt"
          done
          exit 1
