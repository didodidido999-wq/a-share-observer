name: Update representative stock research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/representatives.yml'
      - 'a-share-observer/scripts/representative_roster.py'
  schedule:
    # Beijing 16:18 weekdays: stock daily K, incremental only; stagger from main close.
    - cron: '18 8 * * 1-5'
permissions:
  contents: write
concurrency:
  group: representative-stock-update
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: a-share-observer/requirements.txt
      - run: python -m pip install -r a-share-observer/requirements.txt
      - name: Verify implementation
        run: python -m pytest -q a-share-observer/tests
      - name: Collect representative daily K
        env:
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
          PYTHONUNBUFFERED: '1'
          V4_MIN_COVERAGE: '270'
        run: python a-share-observer/scripts/v4_representatives.py
      - name: Commit verified derived series only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add a-share-observer/docs/data/representatives.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: update representative stock daily histories'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
            sleep "$attempt"
          done
          exit 1
