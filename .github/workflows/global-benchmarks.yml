name: Capture official commodity benchmarks
on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/direct-global-markets']
    paths:
      - '.github/workflows/global-benchmarks.yml'
      - 'a-share-observer/scripts/global_commodities.py'
  schedule:
    # 09:40 Beijing daily. EIA observations may be delayed and remain source-dated.
    - cron: '40 1 * * *'
permissions:
  contents: write
concurrency:
  group: global-direct-data
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r a-share-observer/requirements.txt
      - name: Test benchmark source boundaries
        run: python -m pytest -q a-share-observer/tests/test_global_commodities.py
      - name: Collect official spot prices
        id: collect
        continue-on-error: true
        run: python a-share-observer/scripts/global_commodities.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-benchmark-evidence
          path: |
            a-share-observer/docs/data/global/series/wti_spot.json
            a-share-observer/docs/data/global/series/brent_spot.json
            a-share-observer/docs/data/global/commodities-status.json
          if-no-files-found: warn
      - name: Commit observations and failure status to the running branch
        if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/direct-global-markets')
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test -f a-share-observer/docs/data/global/commodities-status.json || exit 1
          for file in a-share-observer/docs/data/global/series/wti_spot.json a-share-observer/docs/data/global/series/brent_spot.json a-share-observer/docs/data/global/commodities-status.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          git diff --cached --quiet && exit 0
          git commit -m 'data: refresh source-dated official crude spot prices'
          for attempt in 1 2 3; do
            if git push origin "HEAD:$TARGET_BRANCH"; then exit 0; fi
            git fetch origin "$TARGET_BRANCH"
            git rebase "origin/$TARGET_BRANCH" || { git rebase --abort; exit 1; }
          done
          exit 1
      - name: Preserve failed collection signal after publishing its status
        if: always() && steps.collect.outcome == 'failure'
        run: exit 1
