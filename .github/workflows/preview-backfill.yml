name: Preview dated historical recovery (no publication)

on:
  workflow_dispatch:
  push:
    branches: ['fix/closed-market-recovery']
    paths:
      - '.github/workflows/preview-backfill.yml'
      - 'a-share-observer/scripts/targeted_backfill.py'
      - 'a-share-observer/scripts/history.py'
      - 'a-share-observer/scripts/closed_market.py'

permissions:
  contents: read
concurrency:
  group: preview-dated-recovery
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r a-share-observer/requirements.txt
      - name: Run collector tests
        run: python -m pytest -q a-share-observer/tests
      - name: Recover and verify in disposable workspace only
        env:
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
          PYTHONUNBUFFERED: '1'
          TARGET_TRADE_DATE: '2026-11-13'
          V4_MIN_COVERAGE: '270'
        run: |
          mkdir -p recovery-preview
          PYTHONPATH=a-share-observer/scripts python - <<'PY'
          import json
          import pathlib
          import shutil
          import subprocess
          import targeted_backfill
          import v4_representatives
          import v5_sector
          report = {'dates': ['2026-11-12', '2026-11-13'], 'published': False}
          errors = []
          try:
              report['base'] = targeted_backfill.backfill_days(report['dates'])
          except Exception as error:
              # Never persist raw HTTP errors, signed URLs, or secret echoes.
              errors.append({'module': 'base', 'error_type': type(error).__name__})
          try:
              v4_representatives.main()
          except Exception as error:
              errors.append({'module': 'representatives', 'error_type': type(error).__name__})
          report['sectors'] = []
          if 'base' in report:
              for day in report['dates']:
                  try:
                      result = v5_sector.run(day=day)
                      report['sectors'].append(result)
                      if result.get('status') != 'complete':
                          errors.append({'module': 'sector', 'date': day, 'status': result.get('status')})
                  except Exception as error:
                      errors.append({'module': 'sector', 'date': day, 'error_type': type(error).__name__})
          root = pathlib.Path('a-share-observer/docs/data')
          allowed = {'a-share-observer/docs/data/dashboard.json', 'a-share-observer/docs/data/dates.json',
                     'a-share-observer/docs/data/representatives.json'} | {
              f'a-share-observer/docs/data/history/{day}.json' for day in report['dates']}
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          if set(changed) - allowed:
              errors.append({'module': 'validation', 'status': 'unexpected_tracked_file_changes'})
          for day in report['dates']:
              path = root / 'history' / f'{day}.json'
              if not path.exists():
                  continue
              row = json.loads(path.read_text())
              valid = row.get('date') == day and row.get('market', {}).get('date') == day
              valid &= row.get('market', {}).get('samples', 0) >= 3500
              valid &= row.get('market', {}).get('return_samples', 0) >= 3500
              for key in ('sectors', 'indices', 'styles', 'stock_list'):
                  valid &= all(x.get('date') == day for x in row.get(key, []))
              if not valid:
                  errors.append({'module': 'validation', 'date': day, 'status': 'invalid_archive'})
              else:
                  shutil.copyfile(path, pathlib.Path('recovery-preview') / path.name)
          reps = json.loads((root / 'representatives.json').read_text())
          report['representatives'] = {day: sum(any(bar.get('date') == day for bar in bars)
              for bars in reps.get('prices', {}).values()) for day in report['dates']}
          if min(report['representatives'].values()) < 270:
              errors.append({'module': 'representatives', 'status': 'coverage_below_270'})
          for name in ('representatives.json', 'dates.json', 'dashboard.json'):
              shutil.copyfile(root / name, pathlib.Path('recovery-preview') / name)
          report['errors'] = errors
          pathlib.Path('recovery-preview/coverage.json').write_text(json.dumps(report, ensure_ascii=False, indent=2))
          print(json.dumps(report, ensure_ascii=False))
          print('No commit, push, or deployment is performed.')
          if errors:
              raise SystemExit(1)
          PY
      - name: Upload derived recovery preview (including partial results)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dated-recovery-preview
          path: recovery-preview/
          if-no-files-found: warn
          retention-days: 7
